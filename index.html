<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#09070d">
    <meta name="description" content="Эта страница зарезервирована для Госпожи Луки. Её мир скоро откроется.">
    <meta property="og:title" content="LUKA — Место уже занято">
    <meta property="og:description" content="Эта страница зарезервирована для Госпожи Луки.">
    <title>LUKA — Место уже занято</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --base: #09070d;
            --text: #f8f0f2;
            --soft: #b5a0ad;
            --accent: #e7a3b8;
            --accent-hot: #ffcad2;
            --accent-rgb: 193, 76, 119;
            --pulse: 0;
            --load-progress: 0%;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--base);
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100svh;
            background: var(--base);
            color: var(--text);
            font-family: Manrope, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
        }

        button:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid var(--accent-hot);
            outline-offset: 6px;
        }

        ::selection {
            color: #fff;
            background: #9f4667;
        }

        .experience {
            position: relative;
            min-height: 100svh;
            isolation: isolate;
            overflow: hidden;
            background: #09070d;
        }

        .experience[data-skin="lilac"] {
            --accent: #cbb3ff;
            --accent-hot: #eee3ff;
            --accent-rgb: 145, 107, 217;
        }

        /* Pure typographic intro: only the wordmark and the progress / CTA. */
        .intro {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
            padding: 30px 18px;
            background: radial-gradient(ellipse 43% 46% at 50% 50%, #17101a 0%, #0b0810 55%, #08070b 100%);
            text-align: center;
            cursor: default;
            transition: opacity 850ms cubic-bezier(.22, .7, .17, 1), visibility 850ms;
        }

        .intro[data-ready="true"] {
            cursor: pointer;
        }

        .intro.is-leaving {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .word-stage {
            display: grid;
            place-items: center;
            position: relative;
            transform: scale(calc(1 + var(--pulse) * .088));
            transform-origin: center;
            will-change: transform;
        }

        .word {
            grid-area: 1/1;
            display: block;
            margin: 0;
            padding-left: .09em;
            user-select: none;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-weight: 500;
            font-size: clamp(108px, 19vw, 306px);
            line-height: .93;
            letter-spacing: .09em;
            white-space: nowrap;
        }

        .word--outline {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 223, 236, .22);
        }

        .word--fill {
            width: 100%;
            background: linear-gradient(104deg, #cb7998 4%, #ffe4de 41%, #dca1c8 75%, #f0ddf7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            clip-path: inset(0 calc(100% - var(--load-progress)) 0 0);
            filter: drop-shadow(0 0 24px rgba(193, 76, 119, .23));
        }

        .loader-details {
            position: relative;
            display: grid;
            place-items: center;
            height: 34px;
            margin-top: 35px;
            min-width: 300px;
        }

        .loader-details__count,
        .loader-details__cta {
            grid-area: 1/1;
            transition: opacity 550ms ease, transform 550ms ease;
        }

        .loader-details__count {
            font-size: 12px;
            letter-spacing: .32em;
            font-variant-numeric: tabular-nums;
            color: #ccbec8;
        }

        .loader-details__cta {
            opacity: 0;
            transform: translateY(9px);
            color: #f0cdd9;
            font-size: 11px;
            letter-spacing: .25em;
            font-weight: 500;
            text-transform: uppercase;
        }

        .intro[data-ready="true"] .loader-details__count {
            opacity: 0;
            transform: translateY(-9px);
        }

        .intro[data-ready="true"] .loader-details__cta {
            opacity: 1;
            transform: translateY(0);
        }

        .intro.is-beating .loader-details__cta {
            opacity: 0;
            transition: opacity 150ms;
        }

        /* The reveal contains no images, header, footer or extra copy. */
        .main {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100svh;
            padding: 80px 24px max(26px, env(safe-area-inset-bottom));
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(18px) scale(1.018);
            transition: opacity 1150ms cubic-bezier(.2, .75, .2, 1), transform 1350ms cubic-bezier(.2, .75, .2, 1), visibility 1150ms;
            text-align: center;
            background: radial-gradient(ellipse 49% 49% at 50% 42%, rgba(var(--accent-rgb), .105), transparent 77%),
                radial-gradient(ellipse 62% 62% at 12% 10%, rgba(119, 28, 71, .16), transparent 70%),
                radial-gradient(ellipse 58% 68% at 90% 92%, rgba(100, 54, 139, .13), transparent 68%),
                #09070d;
        }

        .main::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: .15;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");
        }

        .main::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(ellipse 70% 75% at 50% 45%, transparent 32%, rgba(0, 0, 0, .39) 100%);
        }

        .experience.is-entered .main {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .main__content {
            width: min(100%, 1050px);
            margin: auto 0;
            padding: 50px 0 42px;
        }

        .eyebrow {
            margin: 0 0 clamp(28px, 5vh, 48px);
            font-size: 10px;
            letter-spacing: .36em;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent);
        }

        .main__title {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(57px, 7.45vw, 118px);
            font-weight: 500;
            line-height: .96;
            letter-spacing: -.035em;
            text-wrap: balance;
            text-shadow: 0 7px 48px rgba(0, 0, 0, .22);
        }

        .main__title span {
            display: block;
        }

        .main__title em {
            color: var(--accent-hot);
            font-weight: 400;
        }

        .subline {
            margin: clamp(29px, 6vh, 56px) 0 0;
            color: #d4c4cd;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(26px, 3vw, 39px);
            font-style: italic;
            font-weight: 400;
            letter-spacing: .015em;
        }

        .promise {
            margin: 21px 0 0;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .24em;
            line-height: 1.8;
            color: #ad91a1;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            width: 100%;
            margin-top: 20px;
        }

        .theme {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .theme__label {
            color: #a48e9f;
            font-size: 10px;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: .15em;
        }

        .theme__options {
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid rgba(230, 203, 222, .15);
            border-radius: 50px;
            background: rgba(20, 13, 24, .62);
        }

        .theme__button {
            padding: 10px 15px;
            border: 0;
            border-radius: 50px;
            color: #b5a8b6;
            background: transparent;
            font-size: 10px;
            cursor: pointer;
            transition: background 300ms, color 300ms, box-shadow 300ms;
        }

        .theme__button[aria-pressed="true"] {
            color: #f8eff6;
            background: rgba(var(--accent-rgb), .24);
            box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .3);
        }

        .theme__button:hover {
            color: #fff;
        }

        .sound {
            display: grid;
            place-items: center;
            width: 37px;
            height: 37px;
            padding: 0;
            border: 1px solid rgba(230, 203, 222, .15);
            border-radius: 50%;
            background: rgba(20, 13, 24, .55);
            color: #d2b6c6;
            cursor: pointer;
            transition: color 250ms, background 250ms;
        }

        .sound:hover {
            color: #fff;
            background: rgba(var(--accent-rgb), .18);
        }

        .sound:disabled {
            cursor: not-allowed;
            opacity: .35;
        }

        .sound svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sound__muted {
            display: none;
        }

        .sound[aria-pressed="false"] .sound__unmuted {
            display: none;
        }

        .sound[aria-pressed="false"] .sound__muted {
            display: block;
        }

        @media (max-width:760px) {
            .word {
                font-size: clamp(93px, 24vw, 177px);
                letter-spacing: .052em;
                padding-left: .052em;
            }

            .loader-details {
                min-width: 260px;
                margin-top: 27px;
            }

            .loader-details__cta {
                font-size: 10px;
                letter-spacing: .14em;
            }

            .main {
                padding: 65px 20px max(24px, env(safe-area-inset-bottom));
            }

            .eyebrow {
                margin-bottom: 30px;
                font-size: 9px;
                letter-spacing: .24em;
            }

            .main__title {
                font-size: clamp(54px, 10.8vw, 82px);
                line-height: .98;
            }

            .main__content {
                padding: 36px 0;
            }

            .subline {
                font-size: clamp(25px, 6vw, 34px);
                margin-top: 32px;
            }

            .promise {
                font-size: 9px;
                letter-spacing: .15em;
            }

            .controls {
                gap: 14px;
            }

            .theme {
                gap: 10px;
            }

            .theme__label {
                font-size: 9px;
            }

            .theme__button {
                padding: 9px 11px;
                font-size: 9px;
            }
        }

        @media (max-width:430px) {
            .main__title {
                font-size: clamp(48px, 11.8vw, 55px);
            }

            .main__title span {
                display: block;
            }

            .theme__label {
                letter-spacing: .08em;
            }
        }

        @media (max-height:640px) {
            .main {
                padding-top: 32px;
                padding-bottom: 20px;
            }

            .main__content {
                padding: 20px 0;
            }

            .eyebrow {
                margin-bottom: 22px;
            }

            .subline {
                margin-top: 21px;
            }

            .promise {
                margin-top: 12px;
            }
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }

            .word-stage {
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="experience" id="experience" data-skin="crimson">
        <section class="intro" id="intro" data-ready="false" tabindex="-1" aria-label="Загрузка LUKA">
            <div class="word-stage" aria-label="LUKA">
                <span class="word word--outline" aria-hidden="true">LUKA</span>
                <span class="word word--fill" aria-hidden="true">LUKA</span>
            </div>
            <div class="loader-details" aria-live="polite" aria-atomic="true">
                <span class="loader-details__count" id="progress">000%</span>
                <span class="loader-details__cta">Нажмите, чтобы продолжить</span>
            </div>
        </section>

        <main class="main" id="main" aria-hidden="true" inert>
            <div class="main__content">
                <p class="eyebrow">Место уже занято</p>
                <h1 class="main__title" id="mainTitle"><span>Эта страница</span><span>зарезервирована</span><span>для
                        <em>Госпожи Луки.</em></span></h1>
                <p class="subline">Её мир скоро откроется.</p>
                <p class="promise">Здесь будет кое-что прекрасное</p>
            </div>
            <div class="controls">
                <div class="theme" role="group" aria-label="Облик Луки">
                    <span class="theme__label">Облик Луки</span>
                    <div class="theme__options">
                        <button class="theme__button" type="button" data-select-skin="crimson"
                            aria-pressed="true">Багряный</button>
                        <button class="theme__button" type="button" data-select-skin="lilac"
                            aria-pressed="false">Лавандовый</button>
                    </div>
                </div>
                <button class="sound" id="soundToggle" type="button" aria-label="Выключить музыку" aria-pressed="true"
                    title="Звук">
                    <svg class="sound__unmuted" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                        <path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12" />
                    </svg>
                    <svg class="sound__muted" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                        <path d="m16 9 5 6m0-6-5 6" />
                    </svg>
                </button>
            </div>
        </main>
    </div>
    <script>
        (() => {
            'use strict';
            /* Web Audio schedules both assets on AudioContext.currentTime. Beat timestamps
               0.4 / 0.7 are IN heart.mp3, whose playback begins at file position 0.3. */
            const TIMING = Object.freeze({
                HEART_FILE_OFFSET: 0.30,
                HEART_BEATS_IN_FILE: [0.40, 0.70],
                HEART_TAIL_AFTER_LAST_BEAT: 0.20,
                PAUSE_AFTER_HEART: 1.00,
                SCHEDULE_AHEAD: 0.035,
            });
            const el = {
                experience: document.getElementById('experience'),
                intro: document.getElementById('intro'),
                main: document.getElementById('main'),
                progress: document.getElementById('progress'),
                sound: document.getElementById('soundToggle'),
            };
            const state = {
                ready: false, entered: false, playingIntro: false,
                loadTarget: 0, loadDisplayed: 0,
                resources: { heart: 0, bg: 0, fonts: 0 },
                ctx: null, buffers: { heart: null, bg: null }, bgSource: null, masterGain: null, muted: false
            };
            const weights = { heart: .44, bg: .44, fonts: .12 };
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const AC = window.AudioContext || window.webkitAudioContext;
            try { if (AC) state.ctx = new AC({ latencyHint: 'interactive' }); }
            catch (e) { console.warn('[LUKA] AudioContext:', e); }

            function updatePart(name, progress) {
                state.resources[name] = Math.min(1, Math.max(0, progress));
                state.loadTarget = Object.entries(weights).reduce((sum, [key, weight]) => sum + weight * state.resources[key], 0) * 100;
            }
            async function fetchBytes(url, name) {
                const res = await fetch(url, { cache: 'force-cache' });
                if (!res.ok) throw new Error(`${res.status} ${url}`);
                const length = Number(res.headers.get('content-length')) || 0;
                if (!res.body?.getReader) { const bytes = await res.arrayBuffer(); updatePart(name, .80); return bytes; }
                const reader = res.body.getReader(), chunks = [];
                let received = 0;
                for (; ;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value); received += value.byteLength;
                    if (length) updatePart(name, Math.min(.8, received / length * .8));
                    else updatePart(name, Math.min(.75, .1 + .65 * (1 - Math.exp(-received / 180000))));
                }
                const bytes = new Uint8Array(received);
                let i = 0; for (const chunk of chunks) { bytes.set(chunk, i); i += chunk.byteLength; }
                return bytes.buffer;
            }
            async function loadSound(name, path, fallback) {
                if (!state.ctx) { updatePart(name, 1); return; }
                try {
                    let bytes;
                    try { bytes = await fetchBytes(path, name); } catch (e) { if (!fallback) throw e; bytes = await fetchBytes(fallback, name); }
                    updatePart(name, .87);
                    try { state.buffers[name] = await state.ctx.decodeAudioData(bytes.slice(0)); }
                    catch (e) { if (!fallback) throw e; const alt = await fetchBytes(fallback, name); state.buffers[name] = await state.ctx.decodeAudioData(alt.slice(0)); }
                } catch (e) { console.warn(`[LUKA] Звуковой файл ${name} не найден или не декодируется:`, e); }
                finally { updatePart(name, 1); }
            }
            async function loadFonts() {
                try { if (document.fonts?.ready) await document.fonts.ready; } catch (e) { }
                finally { updatePart('fonts', 1); }
            }
            function loadingFrame() {
                const target = state.ready ? 100 : Math.min(99.7, state.loadTarget);
                state.loadDisplayed += (target - state.loadDisplayed) * .085;
                if (Math.abs(target - state.loadDisplayed) < .1) state.loadDisplayed = target;
                const value = state.ready ? Math.min(100, Math.round(state.loadDisplayed)) : Math.min(99, Math.floor(state.loadDisplayed));
                el.progress.textContent = `${String(value).padStart(3, '0')}%`;
                el.experience.style.setProperty('--load-progress', `${state.loadDisplayed.toFixed(3)}%`);
                if (state.loadTarget >= 99.999 && state.loadDisplayed >= 99.65 && !state.ready) finishLoading();
                if (!state.entered) requestAnimationFrame(loadingFrame);
            }
            function finishLoading() {
                state.ready = true; state.loadDisplayed = 100;
                el.experience.style.setProperty('--load-progress', '100%');
                el.progress.textContent = '100%';
                el.intro.dataset.ready = 'true';
                el.intro.tabIndex = 0;
                el.intro.setAttribute('role', 'button');
                el.intro.setAttribute('aria-label', 'Нажмите, чтобы продолжить');
            }
            function setupBackground(start) {
                if (!state.ctx || !state.buffers.bg) { el.sound.disabled = true; el.sound.setAttribute('aria-label', 'Музыка недоступна'); return; }
                const source = state.ctx.createBufferSource(); source.buffer = state.buffers.bg; source.loop = true;
                const gain = state.ctx.createGain(); gain.gain.setValueAtTime(.38, start);
                source.connect(gain).connect(state.ctx.destination); source.start(start);
                state.bgSource = source; state.masterGain = gain;
            }
            function scheduleHeart(start) {
                if (!state.ctx || !state.buffers.heart) return;
                const buffer = state.buffers.heart;
                if (buffer.duration <= TIMING.HEART_FILE_OFFSET) return;
                const stopOffset = Math.min(buffer.duration, TIMING.HEART_BEATS_IN_FILE.at(-1) + TIMING.HEART_TAIL_AFTER_LAST_BEAT);
                const end = start + Math.max(0, stopOffset - TIMING.HEART_FILE_OFFSET);
                const src = state.ctx.createBufferSource(), gain = state.ctx.createGain(); src.buffer = buffer;
                src.connect(gain).connect(state.ctx.destination);
                gain.gain.setValueAtTime(.88, start);
                gain.gain.setValueAtTime(.88, Math.max(start, end - .055));
                gain.gain.linearRampToValueAtTime(0, end);
                src.start(start, TIMING.HEART_FILE_OFFSET); src.stop(end);
            }
            function beatShape(dt) { return dt < 0 || dt > .23 ? 0 : (1 - Math.exp(-dt * 85)) * Math.exp(-dt * 20); }
            function beginSequence() {
                if (!state.ready || state.playingIntro || state.entered) return;
                state.playingIntro = true;
                el.intro.classList.add('is-beating');
                const resume = state.ctx ? state.ctx.resume() : Promise.resolve();
                Promise.resolve(resume).catch(() => { }).then(() => {
                    const running = Boolean(state.ctx && state.ctx.state === 'running');
                    const start = (running ? state.ctx.currentTime : performance.now() / 1000) + TIMING.SCHEDULE_AHEAD;
                    if (running) { try { setupBackground(start); scheduleHeart(start); } catch (e) { console.warn('[LUKA] Sound:', e); } }
                    else el.sound.disabled = true;
                    const beats = TIMING.HEART_BEATS_IN_FILE.map(t => t - TIMING.HEART_FILE_OFFSET);
                    const revealAt = Math.max(...beats) + TIMING.HEART_TAIL_AFTER_LAST_BEAT + TIMING.PAUSE_AFTER_HEART;
                    function frame() {
                        const t = (running ? state.ctx.currentTime : performance.now() / 1000) - start;
                        const pulse = reduceMotion ? 0 : Math.max(...beats.map(b => beatShape(t - b)));
                        el.experience.style.setProperty('--pulse', pulse.toFixed(4));
                        if (t >= revealAt) { el.experience.style.setProperty('--pulse', '0'); revealMain(); return; }
                        requestAnimationFrame(frame);
                    }
                    requestAnimationFrame(frame);
                });
            }
            function revealMain() {
                if (state.entered) return;
                state.entered = true;
                el.experience.classList.add('is-entered');
                el.intro.classList.add('is-leaving');
                el.main.removeAttribute('inert'); el.main.setAttribute('aria-hidden', 'false');
                el.intro.setAttribute('aria-hidden', 'true'); el.intro.tabIndex = -1;
            }
            el.intro.addEventListener('click', beginSequence);
            el.intro.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && state.ready) { ev.preventDefault(); beginSequence(); } });
            document.querySelectorAll('[data-select-skin]').forEach(button => button.addEventListener('click', () => {
                el.experience.dataset.skin = button.dataset.selectSkin;
                document.querySelectorAll('[data-select-skin]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
            }));
            el.sound.addEventListener('click', () => {
                if (!state.ctx || !state.masterGain) return;
                state.muted = !state.muted;
                state.masterGain.gain.setTargetAtTime(state.muted ? 0 : .38, state.ctx.currentTime, .025);
                el.sound.setAttribute('aria-pressed', String(!state.muted));
                el.sound.setAttribute('aria-label', state.muted ? 'Включить музыку' : 'Выключить музыку');
            });
            requestAnimationFrame(loadingFrame);
            Promise.all([loadSound('heart', 'assets/audio/heart.mp3'), loadSound('bg', 'assets/audio/bg.ogg', 'assets/audio/bg.mp3'), loadFonts()])
                .then(() => { state.loadTarget = 100; })
                .catch(error => { console.error('[LUKA] Preload:', error); Object.keys(state.resources).forEach(key => updatePart(key, 1)); });
        })();
    </script>
</body>

</html>
